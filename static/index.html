<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edgebook AI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2314b8a6'/><path d='M7 22l6-7 5 4 7-10' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<aside class="side">
  <div class="brand"><span class="logo"></span>Edgebook AI</div>
  <nav>
    <a href="#/" data-nav="dashboard"><i>◧</i>Dashboard</a>
    <a href="#/journal" data-nav="journal"><i>☰</i>Daily journal</a>
    <a href="#/trades" data-nav="trades"><i>⇅</i>Trades</a>
    <a href="#/setups" data-nav="setups"><i>◎</i>Setups</a>
    <a href="#/reports" data-nav="reports"><i>▤</i>Reports</a>
    <a href="#/playbooks" data-nav="playbooks"><i>◈</i>Playbooks</a>
    <a href="#/settings" data-nav="settings"><i>⚙</i>Settings</a>
  </nav>
  <a class="credit" href="https://github.com/reyeslary1691-bit" target="_blank" rel="noopener" title="Lary Reyes on GitHub"><span>Developed by</span>
    <img src="/static/lary-reyes-logo.png" alt="Lary Reyes" onerror="this.replaceWith(Object.assign(document.createElement('b'), { textContent: 'Lary Reyes' }))"></a>
  <div class="side-foot" id="syncInfo"></div>
</aside>

<div class="main">
  <header class="top">
    <h1 id="pageTitle">Dashboard</h1>
    <div class="filters">
      <select id="fAccount" title="Account"></select>
      <select id="fPreset" title="Date range">
        <option value="all">All time</option>
        <option value="today">Today</option>
        <option value="week">This week</option>
        <option value="month">This month</option>
        <option value="30">Last 30 days</option>
        <option value="90">Last 90 days</option>
        <option value="ytd">Year to date</option>
        <option value="custom">Custom…</option>
      </select>
      <span id="customRange" hidden>
        <input type="date" id="fFrom"> <span class="muted">→</span> <input type="date" id="fTo">
      </span>
      <button class="btn primary" id="syncBtn" title="Pull latest trades from MT5">↻ Sync</button>
    </div>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
</div>

<div id="modal" class="modal" hidden><div class="modal-box" id="modalBox"></div></div>
<div id="toast" class="toast" hidden></div>

<script src="/static/app.js"></script>
</body>
</html>
